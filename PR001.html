<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RP - Daily Production Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg">
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-blue-800">Daily Production Report</h1>
                <p class="text-sm text-gray-500">Form No. PR001 | Rev. F</p>
            </div>
            <div class="text-right">
                <img src="https://via.placeholder.com/50x50?text=RP" alt="Logo">
            </div>
        </div>

        <form id="productionForm" class="space-y-6">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-gray-50 p-4 rounded-lg">
                <div>
                    <label class="block text-xs font-bold uppercase">Fecha</label>
                    <input type="date" id="date" class="w-full border rounded p-2">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase">Item No.</label>
                    <input type="text" id="itemNo" placeholder="8075N" class="w-full border rounded p-2">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase">Work Order #</label>
                    <input type="text" id="workOrder" placeholder="WIP" class="w-full border rounded p-2">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase">Shift / Turno</label>
                    <select id="shift" class="w-full border rounded p-2">
                        <option>1st</option>
                        <option>2nd</option>
                        <option>3rd</option>
                    </select>
                </div>
            </div>

            <div class="border p-4 rounded-lg">
                <h3 class="font-bold mb-3 border-b text-gray-700">Staffing / Personal</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="operator" placeholder="Operator (ej. Alfonso M.)" class="border p-2 rounded">
                    <input type="text" id="packer" placeholder="Packer" class="border p-2 rounded">
                    <input type="text" id="forklift" placeholder="Forklift Driver" class="border p-2 rounded">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-4">
                    <h3 class="font-bold border-b text-gray-700">Materia Prima (Rolls)</h3>
                    <div class="flex gap-2">
                        <input type="text" id="rollNo" placeholder="Roll #" class="w-1/2 border p-2 rounded text-sm">
                        <input type="number" id="weight" placeholder="LBS/KG" class="w-1/2 border p-2 rounded text-sm">
                    </div>
                </div>

                <div class="space-y-4">
                    <h3 class="font-bold border-b text-gray-700">Contador Final</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="totalProduced" placeholder="Total Produced" class="border p-2 rounded text-sm">
                        <input type="number" id="totalHold" placeholder="Total on Hold" class="border p-2 rounded text-sm">
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
                Guardar Reporte en Firebase
            </button>
        </form>
    </div>

    <script>
        // Aquí conectaremos Firebase más adelante
        document.getElementById('productionForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('¡Datos capturados! El siguiente paso es conectarlo a tu base de datos Firebase.');
            console.log("Datos listos para enviar:", {
                item: document.getElementById('itemNo').value,
                operator: document.getElementById('operator').value
            });
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
    @media print {
        .no-print { display: none !important; }
        body { background: white; p: 0; }
        .max-w-4xl { box-shadow: none; border: none; width: 100%; max-width: 100%; }
    }
</style>

<div class="flex gap-4 mt-4 no-print">
    <button type="button" onclick="exportarExcel()" class="flex-1 bg-green-600 text-white font-bold py-2 rounded-lg hover:bg-green-700 transition">
        📊 Exportar a Excel
    </button>
    <button type="button" onclick="window.print()" class="flex-1 bg-gray-600 text-white font-bold py-2 rounded-lg hover:bg-gray-700 transition">
        🖨️ Imprimir Reporte
    </button>
</div>

<script>
    // Función para convertir los datos del formulario a Excel
    function exportarExcel() {
        const datos = {
            Fecha: document.getElementById('date').value,
            Item: document.getElementById('itemNo').value,
            WorkOrder: document.getElementById('workOrder').value,
            Turno: document.getElementById('shift').value,
            Operador: document.getElementById('operator').value,
            Empacador: document.getElementById('packer').value,
            Montacargas: document.getElementById('forklift').value,
            Total_Producido: document.getElementById('totalProduced').value
        };

        // Crear una hoja de trabajo
        const ws = XLSX.utils.json_to_sheet([datos]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Produccion");

        // Descargar el archivo
        XLSX.writeFile(wb, `Reporte_Produccion_${datos.Fecha}.xlsx`);
    }
</script>
</body>
</html>
